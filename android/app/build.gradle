plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gbo2.sim'
    compileSdk 36

    defaultConfig {
        applicationId "com.gbo2.sim"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // assets/index.html 은 텍스트+base64 라 압축 저장하면 APK 가 ~1/3 로 줄고,
    // WebView 가 로드 시 자동 해제하므로 체감 로딩 차이는 거의 없다.
}
