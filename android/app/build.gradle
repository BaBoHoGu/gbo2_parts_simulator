plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gbo2.sim'
    compileSdk 36

    defaultConfig {
        applicationId "com.gbo2.sim"
        minSdk 24
        targetSdk 36
        // 버전은 update.ps1 이 데이터 빌드 날짜로 주입한다(-Pvcode=yyyyMMdd -Pvname=yyyy-MM-dd).
        // 인자가 없으면 기본값. 파일을 고치지 않아 git 변경이 생기지 않는다.
        versionCode (project.hasProperty('vcode') ? project.property('vcode').toString().toInteger() : 1)
        versionName (project.hasProperty('vname') ? project.property('vname').toString() : "1.0")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding = 'UTF-8'
    }
}

// 소스의 유니코드 리터럴(예: BOM 비교)이 인코딩과 무관하게 컴파일되도록 UTF-8 고정
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // assets/index.html 은 텍스트+base64 라 압축 저장하면 APK 가 ~1/3 로 줄고,
    // WebView 가 로드 시 자동 해제하므로 체감 로딩 차이는 거의 없다.
}
