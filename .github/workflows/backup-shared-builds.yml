# 공유 갤러리 백업 — Firebase 의 데이터를 이 저장소에 떠 둔다.
#
# 왜: Firebase 무료(Spark) 요금제에는 자동 백업이 없다(유료 Blaze 전용).
#     프로젝트를 실수로 지우거나 한도를 넘겨도 사용자들이 올린 구성은 남아 있어야 한다.
#
# 비밀값이 필요 없다. builds·blocked 는 보안 규칙상 인증 없이 읽히고(공개 갤러리라 당연하다),
# dict 는 tools/make_share_dict.js 로 언제든 다시 만들 수 있으며 throttle 은 버려도 되는 값이다.
# 즉 '읽을 수 있는 것' 과 '지켜야 하는 것' 이 정확히 겹친다.
#
# 복구: 콘솔 → Realtime Database → JSON 가져오기 로 되돌린다.
#       콘솔 가져오기는 관리자 권한이라 at·uid 검증 규칙에 걸리지 않는다.
name: 공유 구성 백업

on:
  schedule:
    - cron: '0 */6 * * *'   # 6시간마다 (GitHub cron 은 수십 분 늦을 수 있다 — 백업엔 문제없다)
  workflow_dispatch:        # 손으로도 돌릴 수 있게

permissions:
  contents: write

concurrency:                # 앞 실행이 밀렸을 때 겹쳐 돌지 않게
  group: backup-shared-builds
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DB: https://gbo2-parts-share-default-rtdb.asia-southeast1.firebasedatabase.app
    steps:
      - uses: actions/checkout@v4

      - name: 내려받기
        run: |
          set -e
          mkdir -p share-backup
          # --fail 로 4xx/5xx 를 실패로 잡는다. 오류 페이지를 백업으로 덮어쓰면 안 된다.
          curl -sSf "$DB/builds.json"  -o /tmp/builds.json
          curl -sSf "$DB/blocked.json" -o /tmp/blocked.json

      - name: 키 순서 고정 (쓸데없는 diff 방지)
        run: |
          node .github/scripts/normalize-backup.js /tmp/builds.json  share-backup/builds.json
          node .github/scripts/normalize-backup.js /tmp/blocked.json share-backup/blocked.json

      - name: 바뀐 게 있을 때만 커밋
        run: |
          git config user.name  "gbo2-backup-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add share-backup
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋하지 않습니다."
          else
            n=$(node -e "console.log(Object.keys(require('./share-backup/builds.json')).length)")
            git commit -m "백업: 공유 구성 ${n}건 ($(date -u '+%Y-%m-%d %H:%M')Z)"
            git push
          fi
