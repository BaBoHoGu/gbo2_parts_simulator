# 공유 갤러리 백업 — 사용자들이 올린 구성을 이 저장소에 떠 둔다.
#
# 왜: D1 도 계정을 잃거나 실수로 지우면 끝이다. 사용자가 올린 것은 우리가 다시
#     만들 수 없는 유일한 데이터라, 코드와 같은 곳에 이력으로 남긴다.
#
# 비밀값이 필요 없다 — 갤러리 목록은 공개 API 다(GET /api/builds).
# 차단 목록·속도 제한은 백업하지 않는다(다시 만들 수 있거나 버려도 되는 값).
#
# 복구: share-backup/builds.json 을 tools/migrate_gallery.js 와 같은 방식으로
#       INSERT 문으로 바꿔 `wrangler d1 execute gbo2-gallery --remote --file=…` 로 넣는다.
name: 공유 구성 백업

on:
  schedule:
    - cron: '0 */6 * * *'   # 6시간마다 (GitHub cron 은 수십 분 늦을 수 있다 — 백업엔 문제없다)
  workflow_dispatch:        # 손으로도 돌릴 수 있게

permissions:
  contents: write

concurrency:                # 앞 실행이 밀렸을 때 겹쳐 돌지 않게
  group: backup-shared-builds
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      API: https://gbo2-parts.pages.dev/api
    steps:
      - uses: actions/checkout@v4

      - name: 내려받기
        run: |
          set -e
          mkdir -p share-backup
          # --fail 로 4xx/5xx 를 실패로 잡는다. 오류 페이지를 백업으로 덮어쓰면 안 된다.
          curl -sSf "$API/builds" -o /tmp/api.json
          # 응답은 { ok, builds: [...] } 다 — 배열만 떠 둔다.
          node -e "const j=require('/tmp/api.json'); if(!j.ok||!Array.isArray(j.builds)) { console.error('예상과 다른 응답'); process.exit(1); } require('fs').writeFileSync('/tmp/builds.json', JSON.stringify(j.builds));" 

      - name: 키 순서 고정 (쓸데없는 diff 방지)
        run: |
          node .github/scripts/normalize-backup.js /tmp/builds.json share-backup/builds.json

      - name: 바뀐 게 있을 때만 커밋
        run: |
          git config user.name  "gbo2-backup-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add share-backup
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋하지 않습니다."
          else
            n=$(node -e "console.log(require('./share-backup/builds.json').length)")
            git commit -m "백업: 공유 구성 ${n}건 ($(date -u '+%Y-%m-%d %H:%M')Z)"
            git push
          fi
